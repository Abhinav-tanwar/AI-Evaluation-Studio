services:
  studio:
    build: .
    ports:
      - "127.0.0.1:8041:8040"
    environment:
      DATABASE_URL: postgresql+psycopg://studio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/studio
      STUDIO_API_TOKEN: ${STUDIO_API_TOKEN:?Set STUDIO_API_TOKEN in .env}
      ALLOW_LIVE_API: "false"
    volumes:
      - studio-runtime:/app/runtime
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - studio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  studio-runtime:
  studio-postgres:
