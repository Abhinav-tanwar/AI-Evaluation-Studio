name: Verify evaluation studio
on:
  push:
    branches: [main, feature/evaluation-studio]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLOW_LIVE_API: "false"
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-tracking.txt
          npm install --global pnpm@11.25.0
          pnpm --dir frontend install --frozen-lockfile
      - name: Check Python and frontend formatting
        run: |
          ruff check studio tests
          ruff format --check studio tests
          pnpm --dir frontend exec prettier --check src index.html package.json tsconfig.json vite.config.ts
      - name: Verify behavior and reference regression gate
        run: |
          pytest -q
          python -m studio.cli --gate --output /tmp/development.json
      - name: Build frontend
        run: pnpm --dir frontend run build
      - name: Build container
        run: docker build -t ai-evaluation-studio:ci .
